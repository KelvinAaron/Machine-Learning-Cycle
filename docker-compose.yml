services:
  api:
    build: .
    environment:
      AUTO_RETRAIN: "true"
      RETRAIN_THRESHOLD: "50"
      ALLOWED_ORIGINS: "*"
    volumes:
      - models:/app/models
      - data:/app/data
    cpus: 1.0
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  models:
  data:
